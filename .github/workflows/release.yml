name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chmod +x pushover
          for target in linux-x86_64 linux-arm64 darwin-x86_64 darwin-arm64; do
            tar -czf "pushover-cli-${version}-${target}.tar.gz" pushover
          done

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md)
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::No CHANGELOG.md section found for version $version"
            exit 1
          fi
          {
            echo "$notes"
            echo
            echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            pushover-cli-*.tar.gz
